[package]
name = "rackhand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rackhand-drivers = { path = "../rackhand-drivers" }
tracing-subscriber = { workspace = true }
rackhand-hub = { path = "../rackhand-hub" }
rackhand-release = { path = "../rackhand-release" }
rackhand-runbook = { path = "../rackhand-runbook" }
rackhand-net = { path = "../rackhand-net" }
rackhand-operator = { path = "../rackhand-operator" }
rackhand-proto = { path = "../rackhand-proto" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal"] }
rackhand-store = { path = "../rackhand-store" }
iroh = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ulid = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
prost = { workspace = true }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }

[features]
# the local lab (plan L2): the test release keys pinned, and `rackhand hub lab-token`; refused in a release build
lab-build = ["rackhand-release/test-keys"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
rusqlite = { workspace = true }
axum = { workspace = true }
rackhand-net = { path = "../rackhand-net", features = ["testing"] }
rackhand-probe = { path = "../rackhand-probe" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
