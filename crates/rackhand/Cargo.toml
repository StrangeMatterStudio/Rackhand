[package]
name = "rackhand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rackhand-hub = { path = "../rackhand-hub" }
rackhand-runbook = { path = "../rackhand-runbook" }
rackhand-net = { path = "../rackhand-net" }
rackhand-proto = { path = "../rackhand-proto" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal"] }
rackhand-store = { path = "../rackhand-store" }
iroh = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ulid = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
