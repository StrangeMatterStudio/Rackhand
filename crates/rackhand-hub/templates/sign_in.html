{% extends "base.html" %}
{% block title %}Sign in: Rackhand{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="/sign-in">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Name <input name="name" required autocomplete="username"></label>
<label>Password <input type="password" name="password" required autocomplete="current-password"></label>
<button type="submit">Continue</button>
</form>
{% if oidc %}<p><a href="/sign-in/oidc">Sign in with your identity provider</a></p>{% endif %}
{% endblock %}
