{% extends "base.html" %}
{% block title %}Sign in: Rackhand{% endblock %}
{% block head %}<script src="/static/forms.js" defer></script>{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/sign-in" novalidate data-check>
{{ form.hidden(csrf)|safe }}
{{ form.problems()|safe }}
{{ form.all_fields()|safe }}
<button type="submit">Continue</button>
</form>
{% if oidc %}<p><a href="/sign-in/oidc">Sign in with your identity provider</a></p>{% endif %}
{% endblock %}
