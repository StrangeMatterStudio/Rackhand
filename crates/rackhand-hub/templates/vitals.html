{% if rows.is_empty() %}<p class="hint">No vitals in the last hour.</p>{% else %}<div class="vitals">
{% for r in rows %}<div class="chart" data-metric="{{ r.metric }}"><p>{{ r.name }}<b>{{ r.last }}</b></p><svg class="spark" viewBox="0 0 300 40" preserveAspectRatio="none" role="img" aria-label="{{ r.metric }} over the last hour"><polyline fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" points="{{ r.line }}"/></svg><small>{{ r.min }} to {{ r.max }}</small></div>
{% endfor %}</div>{% endif %}
