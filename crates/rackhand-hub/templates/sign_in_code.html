{% extends "base.html" %}
{% block title %}{{ title }}: Rackhand{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="{{ action }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Code from your authenticator app <input name="code" required inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code"></label>
<button type="submit">Continue</button>
</form>
{% endblock %}
