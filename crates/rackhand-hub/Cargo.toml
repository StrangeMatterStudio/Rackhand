[package]
name = "rackhand-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# test helpers for other crates' tests (the SMTP sink)
testing = []

[dependencies]
rackhand-drivers = { path = "../rackhand-drivers" }
rackhand-store = { path = "../rackhand-store" }
rackhand-net = { path = "../rackhand-net" }
rackhand-proto = { path = "../rackhand-proto" }
rackhand-runbook = { path = "../rackhand-runbook" }
rackhand-detect = { path = "../rackhand-detect" }
rusqlite = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
jiff = { workspace = true }
iroh = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
getrandom = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
askama = { workspace = true }
argon2 = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
form_urlencoded = { workspace = true }
toml = { workspace = true }
russh = { workspace = true }
git2 = { workspace = true }
regex = "1"
ed25519-dalek = { workspace = true }
webauthn-rs = { workspace = true }
base64 = { workspace = true }
zstd = { workspace = true }
rackhand-release = { path = "../rackhand-release" }
webpki-roots = { workspace = true }
qrcodegen = "1"

[dev-dependencies]
async-trait = "0.1"
# reads the dashboard's QR codes back
rqrr = { version = "0.10", default-features = false }
rackhand-drivers = { path = "../rackhand-drivers", features = ["sim"] }
tower = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rackhand-net = { path = "../rackhand-net", features = ["testing"] }
rackhand-probe = { path = "../rackhand-probe" }
iroh-relay = { workspace = true }
rackhand-release = { path = "../rackhand-release", features = ["test-keys", "signing"] }

[lints]
workspace = true
