[package]
name = "rackhand-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "rackhand_cli"
path = "src/lib.rs"

[[bin]]
name = "rackhand-cli"
path = "src/main.rs"

[dependencies]
rackhand-net = { path = "../rackhand-net" }
rackhand-proto = { path = "../rackhand-proto" }
iroh = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-std", "net", "io-util", "time", "macros"] }
prost = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
