[package]
name = "rackhand-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "rackhand_probe"
path = "src/lib.rs"

[[bin]]
name = "rackhand-probe"
path = "src/main.rs"

[dependencies]
tracing-subscriber = { workspace = true }
rackhand-proto = { path = "../rackhand-proto" }
rackhand-net = { path = "../rackhand-net" }
rackhand-drivers = { path = "../rackhand-drivers" }
url = "2"
iroh = { workspace = true }
tokio = { workspace = true, features = ["process"] }
getrandom = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
prost = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }
tracing = { workspace = true }
regex = "1"
blake3 = "1"
data-encoding = "2"
sha2 = { workspace = true }
sha1 = "0.11"
rackhand-release = { path = "../rackhand-release" }

[target.'cfg(target_os = "linux")'.dependencies]
# statvfs without unsafe code.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "net", "event"] }

[features]
# the local lab and the integration tests: the test release keys pinned, and `RACKHAND_PROBE_VERSION` honored at build time;
# refused in a release build
lab-build = ["rackhand-release/test-keys"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# The connection tables, the pipe's security descriptor and the service manager (T89); every call is in `src/windows`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Services",
] }

[dev-dependencies]
# tests sign releases with keys of their own
rackhand-release = { path = "../rackhand-release", features = ["signing"] }
