// rackhand/tunnel/1 and rackhand/xfer/1 (design 7.3.11).
syntax = "proto3";
package rackhand.tunnel;

message TunnelOpen {
  bytes target = 1;
  uint32 port = 2;
  string purpose = 3;
}

enum TunnelError {
  TUNNEL_ERROR_UNSPECIFIED = 0;
  TUNNEL_ERROR_OUT_OF_SCOPE = 1;
  TUNNEL_ERROR_PORT_NOT_ALLOWED = 2;
  TUNNEL_ERROR_MACHINE_UNREACHABLE = 3;
  TUNNEL_ERROR_UNSUPPORTED = 4;
}

// After `TunnelOpened`, the stream carries raw bytes in both directions.
message TunnelReply {
  oneof reply {
    bool opened = 1;
    TunnelError error = 2;
  }
}

enum XferKind {
  XFER_KIND_UNSPECIFIED = 0;
  XFER_KIND_FILE = 1;
  XFER_KIND_STREAM = 2; // a backup tool's stdout, piped into the receiving command
}

// Content-addressed, BLAKE3-verified, 1 MiB chunks, resumable from the last verified chunk.
message XferOffer {
  bytes transfer_id = 1;
  XferKind kind = 2;
  bytes blake3 = 3; // whole file; empty for streams
  uint64 size = 4;
  uint32 chunk_size = 5;
  bytes target = 6;
  string dest = 7; // file destination, or the receiving command for streams
}

message XferResume { uint64 next_chunk = 1; }

message XferChunk {
  uint64 index = 1;
  bytes blake3 = 2;
  bytes data = 3;
}

message XferDone {
  bool ok = 1;
  string error = 2;
}

// The receiving side's answers on an xfer stream (7.3.11): the first one to the offer, then one to each chunk. `resume` names
// the next chunk it wants (the offer's resume point; after a chunk, the next one, or the same one again if it didn't match);
// `done` ends the transfer, after the last chunk or at once if the offer is refused.
message XferAnswer {
  oneof answer {
    XferResume resume = 1;
    XferDone done = 2;
  }
}
