name = "patch-debian"
description = "Install every pending update on a Debian or Ubuntu machine, reboot if needed, and check it came back as it was"
targets = { kinds = ["linux"] }
identity = "automation"
risk = "normal"
autonomy = 2

# 1 GB free on /, a report to judge by, no open critical incident on the machine (7.5.3).
[[step]]
id = "precheck"
kind = "verify"
checks = ["patch_precheck"]
timeout = "1m"

# Proxmox guests only; named rackhand-patch-<YYYYMMDD-HHMM>, the last 3 kept.
[[step]]
id = "snapshot"
kind = "snapshot"
timeout = "10m"

# The active services and running containers, kept in the job log for the verify step.
[[step]]
id = "record"
kind = "verify"
checks = ["record_state"]
timeout = "1m"

# apt waits up to 10 minutes for a lock someone else holds (E9).
[[step]]
id = "update"
kind = "ssh"
cmd = ["sudo", "/usr/local/lib/rackhand/run", "/usr/bin/env", "DEBIAN_FRONTEND=noninteractive", "/usr/bin/apt-get", "-q", "-o", "DPkg::Lock::Timeout=600", "update"]
detached = true
timeout = "20m"

# Every pending update (owner review: no security-only selection); a changed config file keeps the machine's version.
[[step]]
id = "install"
kind = "ssh"
cmd = ["sudo", "/usr/local/lib/rackhand/run", "/usr/bin/env", "DEBIAN_FRONTEND=noninteractive", "/usr/bin/apt-get", "-q", "-y", "-o", "DPkg::Lock::Timeout=600", "-o", "Dpkg::Options::=--force-confdef", "-o", "Dpkg::Options::=--force-confold", "upgrade", "--with-new-pkgs"]
detached = true
timeout = "60m"

[[step]]
id = "reboot"
kind = "reboot_if_required"
timeout = "20m"

[[step]]
id = "report"
kind = "wait_report"
timeout = "15m"

[[step]]
id = "verify"
kind = "verify"
checks = ["as_recorded", "required_mounts", "bound_checks"]
timeout = "5m"
