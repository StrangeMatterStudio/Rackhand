name = "reboot-host"
description = "Reboot a hypervisor that needs it, and check it came back as it was"
targets = { roles = ["hypervisor"] }
identity = "automation"
risk = "high"
autonomy = 1

# The active services and running containers, kept in the job log for the verify step.
[[step]]
id = "record"
kind = "verify"
checks = ["record_state"]
timeout = "1m"

# Only a job with an approved high-risk approval may reboot a hypervisor (E13); one that no longer needs it isn't.
[[step]]
id = "reboot"
kind = "reboot_if_required"
timeout = "20m"

[[step]]
id = "report"
kind = "wait_report"
timeout = "15m"

[[step]]
id = "verify"
kind = "verify"
checks = ["as_recorded", "required_mounts", "bound_checks"]
timeout = "5m"
