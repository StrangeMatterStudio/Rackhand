name = "compose-update"
description = "Pull a Docker Compose project's images, start what changed, and check its containers"
targets = { kinds = ["linux", "alpine"] }
identity = "automation"
risk = "normal"
autonomy = 1

[params.project]
type = "string"
pattern = "[a-zA-Z0-9_][a-zA-Z0-9_-]{0,63}"

# The project's Compose file on the machine.
[params.file]
type = "string"
pattern = "(/[a-zA-Z0-9_][a-zA-Z0-9_.-]*)+\\.ya?ml"

[[step]]
id = "pull"
kind = "ssh"
cmd = ["sudo", "/usr/local/lib/rackhand/run", "/usr/bin/docker", "compose", "-p", "{{project}}", "-f", "{{file}}", "pull", "--quiet"]
detached = true
timeout = "30m"

[[step]]
id = "up"
kind = "ssh"
cmd = ["sudo", "/usr/local/lib/rackhand/run", "/usr/bin/docker", "compose", "-p", "{{project}}", "-f", "{{file}}", "up", "--detach"]
detached = true
timeout = "15m"

# A report from after it: the checks below judge that one, not the state before.
[[step]]
id = "report"
kind = "wait_report"
timeout = "5m"

[[step]]
id = "verify"
kind = "verify"
checks = ["containers_running:{{project}}"]
timeout = "5m"
