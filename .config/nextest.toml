# Test profiles for `cargo xtask ci <tier>` (design 14). Retries stay at 0: a flaky test is a bug.

[test-groups]
timed = { max-threads = 1 }

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
retries = 0
fail-fast = false
# the release tier builds the hub twice over: `cargo xtask ci release` runs these
default-filter = "not test(release::slow_tests::)"
slow-timeout = { period = "30s", terminate-after = 4 }
junit = { path = "junit.xml" }

[profile.it]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
junit = { path = "junit.xml" }

# AC2's 10-minute outage and up to 15 minutes of replay (plan T42)
[[profile.it.overrides]]
filter = 'test(outage_backfills_and_live_stays_fresh) | test(disk_rule_callouts_and_resolution)'
slow-timeout = { period = "60s", terminate-after = 30 }

# The tests that time a real hub and probe (AC1, AC2, AC5, AC8) run one at a time: under the tier's other containers
# the outage test once missed its 15 minutes (plan T43), and alone it fills in under 2.
[[profile.it.overrides]]
filter = 'test(probe_hub::) | test(callouts::) | test(checks::)'
test-group = 'timed'

# AC41 (plan T97): a hub, its machine and a mail server on a network of their own; the disk rule's 5 minutes, then the
# runbook, after builds of the hub with the test SMTP roots and of the mail server. One at a time, like the timed ones.
[[profile.it.overrides]]
filter = 'test(offline::)'
test-group = 'timed'
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.net]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ebpf]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.live]
retries = 0
fail-fast = false
test-threads = 1
# the live tests print what they measured (install times, callout delays), kept as evidence
success-output = "immediate"
slow-timeout = { period = "120s", terminate-after = 15 }

# The cut test waits 10 minutes, then up to 15 for the hole to fill (AC2).
[[profile.live.overrides]]
filter = 'test(cut_link_backfills_without_stale_incidents)'
slow-timeout = { period = "120s", terminate-after = 25 }

[profile.perf]
retries = 0
fail-fast = false
slow-timeout = { period = "600s", terminate-after = 12 }
junit = { path = "junit.xml" }

# The release tier (T91): static artifacts and a commit built twice in two places. Each builds the hub, so the limits are long.
[profile.release]
retries = 0
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 24 }

# The same tests run by name outside the tier (the plan's verification) get the same time.
[[profile.default.overrides]]
filter = 'test(release::slow_tests::)'
slow-timeout = { period = "300s", terminate-after = 24 }

# and the offline test (plan T97), whose verification runs it by name
[[profile.default.overrides]]
filter = 'package(rackhand-it) & test(offline::)'
slow-timeout = { period = "60s", terminate-after = 20 }
