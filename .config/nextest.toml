# Test profiles for `cargo xtask ci <tier>` (design 14). Retries stay at 0: a flaky test is a bug.

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
junit = { path = "junit.xml" }

[profile.it]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
junit = { path = "junit.xml" }

# AC2's 10-minute outage and up to 15 minutes of replay (plan T42)
[[profile.it.overrides]]
filter = 'test(outage_backfills_and_live_stays_fresh) | test(disk_rule_callouts_and_resolution)'
slow-timeout = { period = "60s", terminate-after = 30 }

[profile.net]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ebpf]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.live]
retries = 0
fail-fast = false
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 15 }

[profile.perf]
retries = 0
fail-fast = false
slow-timeout = { period = "600s", terminate-after = 12 }
junit = { path = "junit.xml" }
