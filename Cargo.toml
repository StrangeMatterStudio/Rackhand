[workspace]
resolver = "2"
members = ["crates/*", "tests/it", "tests/net", "tests/ebpf", "tests/perf", "tests/live", "xtask"]
default-members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StrangeMatterStudio/Rackhand"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
prost = "0.14"
prost-build = "0.14"
zstd = "0.14"
ed25519-dalek = { version = "2", features = ["rand_core"] }
thiserror = "2"
# Pinned to the version spikes S2 and S3 measured (T08, T09); iroh's API moves between 1.x minors.
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.5.0", features = ["server", "test-utils"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs"] }
tracing = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
ulid = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
