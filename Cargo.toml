[workspace]
resolver = "2"
members = ["crates/*", "tests/it", "tests/net", "tests/ebpf", "tests/perf", "tests/live", "xtask"]
default-members = ["crates/*", "xtask"]
# a patched copy of a dependency (see [patch.crates-io]) is built, not linted or tested as ours
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StrangeMatterStudio/Rackhand"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
prost = "0.14"
prost-build = "0.14"
zstd = "0.14"
ed25519-dalek = { version = "2", features = ["rand_core"] }
thiserror = "2"
# Pinned to the version spikes S2 and S3 measured (T08, T09); iroh's API moves between 1.x minors.
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.5.0", features = ["server", "test-utils"] }
n0-future = "0.3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ulid = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"
# Dashboard (7.7.1): axum and askama over hyper; TLS with rustls on ring only (iroh uses ring, so no second crypto
# provider), rcgen for the self-signed certificate, Argon2id for passwords.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "form", "query", "matched-path"] }
askama = "0.14"
argon2 = "0.5"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
form_urlencoded = "1"
# SSH to managed machines (7.3.7): ring as everywhere else, Ed25519 keys only (no RSA crate).
# The library's git mirror (S7): libgit2, libssh2 and OpenSSL vendored and linked statically.
git2 = { version = "0.21", default-features = false, features = ["ssh", "vendored-libgit2", "vendored-openssl"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }
# Passkeys (7.7.2): webauthn-rs, on the OpenSSL that git2 already vendors. OIDC ID tokens are checked with ring.
webauthn-rs = { version = "0.5", default-features = false }
base64 = "0.22"
# OIDC (7.7.2): the provider's certificate is checked against the Mozilla roots.
webpki-roots = "1"
# Timezones and daylight saving for windows (7.5.3); the bundled database gives the same answers on every host.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Argon2id at its real cost is slow unoptimized; tests hash real passwords.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# iroh and iroh-relay 1.5.0 as published, except that their manifests ask for a cdylib too: it exports more than the 65535
# symbols a Windows DLL can hold, so it stops the x86_64-pc-windows-gnu probe and CLI from linking (T89, D163). Only
# `crate-type` differs, and the tests and examples are left out; remove this when upstream does.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
iroh-relay = { path = "vendor/iroh-relay" }
