# The local lab (plan L1, D107): QEMU/KVM machines in WSL, run as the normal user.
# Site networks are documentation ranges (D71): site A 192.0.2.0/24, site B 198.51.100.0/24. Every machine also has a
# user-mode NIC for the internet and for SSH from WSL on 127.0.0.1:<ssh_port>.

[sites.a]
network = "192.0.2.0/24"
mcast_port = 23001

[sites.b]
network = "198.51.100.0/24"
mcast_port = 23002

[[machine]]
name = "hub"
image = "debian-12"
cpus = 2
memory_mb = 2048
ssh_port = 22101
nics = [{ site = "a", address = "192.0.2.10" }]

[[machine]]
name = "target"
image = "ubuntu-24.04"
cpus = 2
memory_mb = 2048
ssh_port = 22102
nics = [{ site = "a", address = "192.0.2.20" }]

[[machine]]
name = "agentless"
image = "debian-12"
cpus = 1
memory_mb = 1024
ssh_port = 22103
nics = [{ site = "a", address = "192.0.2.30" }]

[[machine]]
name = "alpine"
image = "alpine-3.20"
cpus = 1
memory_mb = 512
ssh_port = 22104
nics = [{ site = "a", address = "192.0.2.40" }]

[[machine]]
name = "pve8"
image = "debian-12"
cpus = 4
memory_mb = 4096
ssh_port = 22105
extra_disk_gb = 16
proxmox = 8
nics = [{ site = "a", address = "192.0.2.51" }]
# guests: ct-test 192.0.2.151, vm-test 192.0.2.161

[[machine]]
name = "pve9"
image = "debian-13"
cpus = 4
memory_mb = 4096
ssh_port = 22106
extra_disk_gb = 16
proxmox = 9
nics = [{ site = "a", address = "192.0.2.52" }]
# guests: ct-test 192.0.2.152, vm-test 192.0.2.162, ct-hub 192.0.2.153 (L4)

[[machine]]
name = "operator"
image = "debian-12"
cpus = 2
memory_mb = 2048
ssh_port = 22107
nics = [{ site = "a", address = "192.0.2.60" }]

[[machine]]
name = "relay"
image = "debian-12"
cpus = 1
memory_mb = 1024
ssh_port = 22108
nics = [{ site = "a", address = "192.0.2.2" }, { site = "b", address = "198.51.100.2" }]

[[machine]]
name = "hub-b"
image = "debian-12"
cpus = 2
memory_mb = 2048
ssh_port = 22109
nics = [{ site = "b", address = "198.51.100.10" }]

[[machine]]
name = "target-b"
image = "debian-12"
cpus = 2
memory_mb = 2048
ssh_port = 22110
nics = [{ site = "b", address = "198.51.100.20" }]

[profiles]
lab = ["hub", "target", "alpine", "pve8", "pve9"]
spikes = ["pve8", "pve9"]
m1 = ["hub", "target"]
m2 = ["hub", "target", "agentless", "alpine", "pve8", "pve9"]
m3 = ["hub", "target", "pve9"]
m4 = ["hub", "target", "agentless", "pve9"]
m5 = ["hub", "target", "operator"]
m6 = ["hub", "target", "relay", "hub-b", "target-b"]
m8 = ["hub", "target", "alpine", "pve9", "hub-b"]
