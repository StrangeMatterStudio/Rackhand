# Local lab base images (plan L1, D107). Each is pinned to a dated build by the hash in the publisher's checksum
# file (Debian and Alpine publish SHA-512, Ubuntu SHA-256). `cargo xtask lab fetch` deletes a download that
# doesn't match. Files are cached under ~/.cache/rackhand-lab/images.

