[package]
name = "rackhand-it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "it"
path = "src/lib.rs"

[dev-dependencies]
toml = { workspace = true }
rcgen = { workspace = true }
time = "0.3"
serde_json = { workspace = true }
blake3 = "1"
rackhand-hub = { path = "../../crates/rackhand-hub", features = ["testing"] }
rackhand-drivers = { path = "../../crates/rackhand-drivers", features = ["sim"] }
rackhand-probe = { path = "../../crates/rackhand-probe" }
rackhand-release = { path = "../../crates/rackhand-release", features = ["signing"] }
rackhand-net = { path = "../../crates/rackhand-net", features = ["testing"] }
ulid = { workspace = true }
rackhand-store = { path = "../../crates/rackhand-store" }
rackhand-runbook = { path = "../../crates/rackhand-runbook" }
rackhand-proto = { path = "../../crates/rackhand-proto" }
iroh = { workspace = true }
ed25519-dalek = { workspace = true }
rusqlite = { workspace = true }
russh = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
